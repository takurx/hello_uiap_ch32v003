[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = arduino

upload_protocol = minichlink
;upload_speed = 115200
upload_port = 32V003

;monitor_speed = 115200
;monitor_port = 32V003

